# ---------------------------------------------------------------------------
# Producción: un único origen sirve el SPA de Angular y la API de Laravel.
#   /            -> estáticos de Angular (fallback a index.html)
#   /api, /up    -> Laravel vía FastCGI
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 16M;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/gzip.conf;

    # ---------------------------------------------------------------- Laravel
    # `^~` evita que estas rutas caigan en las regex de estáticos de más abajo.
    location ^~ /api {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage {
        root /var/www/html/public;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Atiende la redirección interna que generan los try_files de arriba.
    include /etc/nginx/snippets/php-fpm.conf;

    # ---------------------------------------------------------------- Angular
    # Los bundles llevan hash en el nombre: se pueden cachear indefinidamente.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html nunca se cachea: es quien apunta a los bundles nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
