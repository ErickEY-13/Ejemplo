# ---------------------------------------------------------------------------
# Producción: un único origen sirve el SPA de Angular y la API de Laravel.
#   /            -> estáticos de Angular (fallback a index.html)
#   /api, /up    -> Laravel vía FastCGI
#
# HTTPS: los certificados de Let's Encrypt se montan desde el host en
#   /etc/letsencrypt (read-only).
#
# Si aún no tienes certificado, el servidor arranca solo con HTTP (port 80)
# y el bloque SSL se activa al existir el cert.
# ---------------------------------------------------------------------------

# Redirige todo HTTP → HTTPS (excepto el challenge de Let's Encrypt).
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ejemplo.webhop.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ejemplo.webhop.me/privkey.pem;

    # Parámetros de seguridad TLS recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 16M;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/gzip.conf;

    # ---------------------------------------------------------------- Laravel
    location ^~ /api {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Archivos subidos (fotos de personas y vehículos).
    #
    # Se apunta directamente al volumen `app_storage`, no a public/storage: ese
    # enlace lo crea `storage:link` dentro del contenedor `app` y además está en
    # .dockerignore, así que nunca llega a esta imagen. Usar `root` con el
    # enlace ausente devolvía 404 en todas las fotos.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
        expires 30d;
        access_log off;
    }

    include /etc/nginx/snippets/php-fpm.conf;

    # ---------------------------------------------------------------- Angular
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
